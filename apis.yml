description: 'EvolutionIQ is an AI-native insurance technology company providing claims guidance
  software for the insurance industry. Its platform surfaces claim-specific, actionable guidance to
  help claims professionals resolve complex cases, spanning Auto Casualty, Group & Individual Disability,
  Workers'' Compensation, and Income Protection lines of business, plus Medhub, which converts unstructured
  medical records into claim-specific insights. Backed by First Round Capital and ICONIQ Capital, the
  company reports outcomes such as a 5-10 point reduction in combined ratio and 20%+ improvement in
  handling capacity. EvolutionIQ operates as a B2B enterprise vendor and does not publish a public
  developer API, SDKs, or API documentation; this profile captures its identity and public-surface
  security posture for the API Evangelist network.'
